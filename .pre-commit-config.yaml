# Local pre-commit hooks. Emergency escape: SKIP=local-tests,sast,vuln,secrets,fmt git commit
# Install once: make hooks   (or: pre-commit install)
repos:
  - repo: local
    hooks:
      - id: local-tests
        name: local tests
        language: system
        entry: make test
        pass_filenames: false
        always_run: true
      - id: sast
        name: static security scanner
        language: system
        entry: make sast
        pass_filenames: false
        always_run: true
      - id: vuln
        name: 3rd-party dependency scanner
        language: system
        entry: make vuln
        pass_filenames: false
        always_run: true
      - id: secrets
        name: gitleaks
        language: system
        entry: make secrets
        pass_filenames: false
        always_run: true
      - id: fmt
        name: ocamlformat
        language: system
        entry: make fmt-check
        pass_filenames: false
        always_run: true
